<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كامل المنوفي | القائمة — Kamel El Menofy Menu</title>
<meta name="description" content="القائمة الكاملة لكامل المنوفي — مشويات وطواجن وأطباق مصرية. الأسعار بالجنيه المصري. Full Kamel El Menofy menu — prices in EGP.">
<meta property="og:title" content="كامل المنوفي | القائمة">
<meta property="og:description" content="طعم له أصل — القائمة الكاملة، الأسعار بالجنيه المصري.">
<meta property="og:image" content="cover.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#231913">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">
</head>
<body>

<a class="skip" href="#menu">تخطي إلى القائمة | Skip to menu</a>

<!-- ============ COVER ============ -->
<header class="cover">
  <div class="cover-photo" role="presentation"></div>
  <div class="cover-inner">
    <img class="cover-logo" src="logo.png" alt="كامل المنوفي" width="96" height="96">
    <h1 class="cover-name">
      <span class="ar">كامل المنوفي</span>
      <span class="en">Kamel El Menofy</span>
    </h1>
    <p class="cover-slogan">
      <span class="ar">طعم له أصل</span>
      <span class="en">A taste with roots</span>
    </p>
    <p class="cover-kicker" data-i18n="coverKicker"></p>
  </div>
  <button id="langToggleCover" class="lang-toggle cover-lang" type="button" aria-label="Switch language">
    <span data-lang-current>EN</span>
  </button>
  <div class="cover-cue" aria-hidden="true"></div>
</header>

<!-- ============ STICKY NAV ============ -->
<div id="bar" class="bar">
  <div class="bar-inner">
    <img class="bar-logo" src="logo.png" alt="" width="34" height="34">
    <span class="bar-name">
      <span class="ar">كامل المنوفي</span>
      <span class="en">Kamel El Menofy</span>
    </span>
    <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">
      <span data-lang-current>EN</span>
    </button>
  </div>
  <nav id="catNav" class="cat-nav" aria-label="Menu categories"></nav>
</div>

<!-- ============ MENU ============ -->
<main id="menu">
  <p class="draft-line" data-i18n="draftLine"></p>
  <div id="menuSections"></div>

  <section class="notes">
    <h2 data-i18n="notesTitle"></h2>
    <ul id="notesList"></ul>
  </section>
</main>

<footer class="foot">
  <img class="foot-logo" src="logo.png" alt="" width="52" height="52">
  <p class="foot-slogan">
    <span class="ar">طعم له أصل</span>
    <span class="en">A taste with roots</span>
  </p>
  <p class="foot-status" data-i18n="footStatus"></p>
</footer>

<script src="menu-data.js"></script>
<script src="menu.js"></script>
</body>
</html>
